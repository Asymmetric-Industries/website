<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asymmetric Industries</title>
<meta name="description" content="Your frontline operators are your edge. We compound them.">
<meta name="theme-color" content="#202521">
<link rel="icon" href="/brand/favicon-32.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/avatar.png">
<style>
  /* Tokens from brand-kit v1.4.0 (system/design-tokens.json) */
  :root{
    --ink:#202521; --paper:#F1EEE5; --accent:#BAE35A; --muted:#5F6B62; --rule:#D2D5C9; --white:#FFFFFF;
    --font:Arial,Helvetica,sans-serif;
    --edge:clamp(24px,5vw,64px);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{
    font-size:11px; letter-spacing:2px; text-transform:uppercase;
  }

  /* Dark cover */
  .cover{
    background:var(--ink); color:var(--paper);
    min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column;
    padding:var(--edge);
  }
  header{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .name{font-weight:700; font-size:15px; letter-spacing:-.2px;}
  main{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:12vh 0 8vh;
  }
  h1{
    font-weight:700; letter-spacing:-.03em; line-height:1.0;
    font-size:clamp(52px,10vw,136px);
  }
  h1 .type{
    border-right:.06em solid var(--accent); padding-right:.03em;
    animation:caret 1.05s step-end infinite;
  }
  @keyframes caret{0%,100%{border-color:var(--accent);}50%{border-color:transparent;}}
  @media (prefers-reduced-motion: reduce){
    h1 .type{animation:none; border-right-color:transparent;}
  }
  .ethos{
    margin-top:32px; max-width:34ch;
    font-size:clamp(20px,2.4vw,28px); line-height:1.25;
  }
  .cta{
    align-self:flex-start; margin-top:48px; text-decoration:none;
    background:var(--accent); color:var(--ink);
    font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    padding:16px 28px; transition:opacity .15s;
  }
  .cta:hover{opacity:.88;}

  /* Light content */
  .contact{
    padding:96px var(--edge) 64px;
  }
  .contact-inner{max-width:640px;}
  .contact h2{
    font-size:clamp(32px,4vw,48px); line-height:1.12; letter-spacing:-1px; font-weight:700;
    margin-top:16px;
  }
  .contact .eyebrow{color:var(--muted);}
  form{margin-top:32px; display:grid; gap:16px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}
  input,textarea{
    width:100%; background:var(--white); border:1px solid var(--rule);
    color:var(--ink); font-family:var(--font); font-size:16px;
    padding:14px; border-radius:0; outline:none; transition:border-color .15s;
  }
  input:focus,textarea:focus{border-color:var(--ink);}
  ::placeholder{color:var(--muted);}
  textarea{min-height:128px; resize:vertical;}
  button{
    justify-self:start; cursor:pointer; border:none; border-radius:0;
    background:var(--ink); color:var(--paper);
    font-family:var(--font); font-size:13px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; padding:16px 32px;
    transition:opacity .15s;
  }
  button:hover{opacity:.88;}
  .sent{
    display:none; margin-top:24px; border-left:4px solid var(--accent);
    background:var(--white); padding:14px 16px; font-size:15px;
  }
  .sent.show{display:block;}
  footer{
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin:0 var(--edge); padding:24px 0 32px;
    border-top:1px solid var(--rule); color:var(--muted);
  }
  .hp{position:absolute; left:-9999px; opacity:0;}
</style>
</head>
<body>
  <section class="cover">
    <header>
      <span class="name">Asymmetric Industries</span>
      <span class="eyebrow">London</span>
    </header>

    <main>
      <h1>Asymmetric<br><span class="type" id="type" aria-live="polite">Industries</span></h1>
      <p class="ethos">Your frontline operators are your edge.<br>We compound&nbsp;them.</p>
      <a class="cta" href="#contact">Contact&nbsp;&rarr;</a>
    </main>
  </section>

  <section class="contact" id="contact">
    <div class="contact-inner">
      <div class="eyebrow">Contact</div>
      <h2>Get in touch</h2>
      <form action="https://formsubmit.co/hsingh@asymmetric-industries.com" method="POST">
        <input type="hidden" name="_subject" value="Asymmetric Industries — website enquiry">
        <input type="hidden" name="_next" value="https://asymmetric-industries.com/?sent=1#contact">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
        <div class="row2">
          <input type="text" name="name" placeholder="Name" aria-label="Name" required>
          <input type="email" name="email" placeholder="Email" aria-label="Email" required>
        </div>
        <input type="text" name="organisation" placeholder="Organisation" aria-label="Organisation">
        <textarea name="message" placeholder="Message" aria-label="Message" required></textarea>
        <button type="submit">Send&nbsp;&rarr;</button>
      </form>
      <div class="sent" id="sent">Received. We&rsquo;ll be in touch.</div>
    </div>
  </section>

  <footer>
    <span class="eyebrow">&copy; 2026 Asymmetric Industries</span>
    <span class="eyebrow">Private &amp; Confidential</span>
  </footer>

<script>
  if (new URLSearchParams(location.search).get('sent') === '1') {
    document.getElementById('sent').classList.add('show');
  }

  (function () {
    var el = document.getElementById('type');
    if (!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var words = ['Industries', 'Advantage'];
    var TYPE = 95, DEL = 45, HOLD = 1700, GAP = 450;
    var wi = 0, ci = words[0].length, deleting = true;
    function tick() {
      var w = words[wi];
      if (deleting) {
        el.textContent = w.slice(0, --ci);
        if (ci === 0) { deleting = false; wi = (wi + 1) % words.length; return setTimeout(tick, GAP); }
        return setTimeout(tick, DEL);
      }
      el.textContent = w.slice(0, ++ci);
      if (ci === w.length) { deleting = true; return setTimeout(tick, HOLD); }
      return setTimeout(tick, TYPE);
    }
    setTimeout(tick, HOLD);
  })();
</script>
</body>
</html>
